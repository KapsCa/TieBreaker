    <script>
      // Ensure window.fetch has both a getter and a setter so that third-party polyfills
      // or extensions attempting to assign window.fetch do not throw a TypeError.
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _nativeFetch;
            },
            set: function(val) {
              _nativeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
